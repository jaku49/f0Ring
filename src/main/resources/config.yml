# ==================================================
#                 f0Ring Configuration
#          Version: 1.1.0 | Created by jaku49/f0rant
# ==================================================
# This file handles all visual aspects of the plugin.
# Support HEX colors: &#RRGGBB
# ==================================================

# --------------------------------------------------
# SYSTEM SETTINGS
# --------------------------------------------------
updater:
  enabled: true
  url: "https://raw.githubusercontent.com/jaku49/f0Ring/refs/heads/main/main/version.txt"
  interval: 30 # Check every 30 minutes

database:
  type: "MYSQL" # Options: MYSQL, SQLITE
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "minecraft"
    password: "mc123"
    table: "f0ring_users"

# --------------------------------------------------
# GUI APPEARANCE
# --------------------------------------------------
gui:
  title: "&#FFB900&lSelect your Ring"
  border-material: GRAY_STAINED_GLASS_PANE
  back-button: "&#FF5050&l« Back"
  equipped-text: "&#50FF50(Currently Active)"

  settings-button:
    slot: 0
    material: COMPARATOR
    name: "&#FFB900&lVisibility Settings"
    lore:
      - ""
      - "&7Adjust your visual experience."
      - "&8&oClick to manage filters."

  player-info:
    slot: 4
    name: "&#FFB900&lYour Profile"
    lore:
      - "&8&m--------------------------"
      - "&7Status: %f0ring_status%"
      - "&7Active Ring: &f%f0ring_name%"
      - "&7Shape: &f%f0ring_shape%"
      - ""
      - "&7Unlocked: &#FFB900%f0ring_unlocked%&8/&e%f0ring_total%"
      - "&8&m--------------------------"

  creator-button:
    slot: 8
    material: COMMAND_BLOCK
    name: "&#FF55FF&lCustom Ring Creator"
    permission: "f0ring.creator"
    lore:
      - ""
      - "&7Design your own unique effect."
      - "&8&oClick to open editor."
      - ""
      - "&8Rank Required: &dCreator"

  remove-button:
    slot: 49
    material: BARRIER
    name: "&#FF5050&lRemove Effect"
    lore:
      - "&7Clear all active particles."
      - "&8&oClick to deactivate."

  lore-has-permission:
    - "&8&m--------------------------"
    - ""
    - "&7Shape Type: &#FFB900{shape}"
    - ""
    - "&#50FF50✔ Unlocked"
    - "&eClick to equip this effect."
    - "&8&m--------------------------"

  lore-no-permission:
    - "&8&m--------------------------"
    - ""
    - "&7Shape Type: &#FFB900{shape}"
    - ""
    - "&#FF5050✘ Locked"
    - "&7Available in our webstore."
    - "&8&m--------------------------"

settings-gui:
  title: "&#FFB900&lPreferences"
  border: BLACK_STAINED_GLASS_PANE
  status-visible: "&#50FF50Visible"
  status-hidden: "&#FF5050Hidden"
  status-enabled: "&#50FF50Enabled"
  status-disabled: "&#FF5050Disabled"
  hide-self:
    slot: 20
    material: ENDER_EYE
    name: "&#FFB900&lPersonal View"
  resume:
    slot: 22
    material: CLOCK
    name: "&#FFB900&lAuto-Resume on Join"
  hide-others:
    slot: 24
    material: SPYGLASS
    name: "&#FFB900&lOther Players' Rings"

creator-gui:
  title: "&#FF55FF&lRing Designer"
  border: BLACK_STAINED_GLASS_PANE
  custom-ring-name: "&#FF55FFMy Custom Design"
  click-chat: "&7Click to enter HEX in chat!"
  carousel:
    instructions: "&8» &7Left: &aPrev &8| &7Right: &aNext"
    selected: "&#50FF50▶ &l{val}"
    unselected: "&8  {val}"
  items:
    shape: { slot: 20, material: SLIME_BALL, name: "&#FFB900Change Shape" }
    type: { slot: 22, material: PRISMARINE_CRYSTALS, name: "&#FFB900Animation Type" }
    color1: { slot: 24, material: RED_DYE, name: "&fPrimary Color: &#FFB900{val}" }
    color2: { slot: 25, material: BLUE_DYE, name: "&fSecondary Color: &#FFB900{val}" }
    save: { slot: 40, material: EMERALD_BLOCK, name: "&#50FF50&l✔ Save & Equip" }

# --------------------------------------------------
# LOCALIZATION & MESSAGES
# --------------------------------------------------
placeholders:
  status-on: "&#50FF50Enabled"
  status-off: "&#FF5050Disabled"
  no-ring: "&7None"
  no-shape: "&7Standard"

messages:
  prefix: "&#FFB900&lf0Ring &8»"
  only-players: "%prefix% &#FF5050This command is for players only!"
  usage: "%prefix% &7Usage: &#FFB900/f0ring <reload|alloff>"
  no-permission: "%prefix% &#FF5050Insufficient permissions!"
  no-permission-command: "%prefix% &#FF5050You don't have admin rights!"
  ring-equipped: "%prefix% &#50FF50Ring equipped successfully!"
  ring-removed: "%prefix% &7Your ring has been removed."
  creator-title: "&eEnter HEX Code"
  creator-sub: "&7Example: #FFB900"
  creator-success: "%prefix% &aColor updated: &f"
  creator-error: "%prefix% &#FF5050Invalid format! Use HEX (e.g., #FF0000)"

shape-names:
  CIRCLE: "Single Circle"
  DOUBLE_RING: "Double Ring"
  STAR: "Pentagram Star"
  HELIX: "Spiraling Helix"
  WAVE: "Pulsating Wave"
  HEART: "Heart Aura"
  DNA: "Double DNA Helix"
  ORBITALS: "Atomic Orbitals"

